[project]
name = "hy-motion-staged-gpu"
version = "0.1.0"
description = "CPU text encoding and CUDA motion sampling with the unchanged official HY-Motion standard model"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1+cu124",
  "torchvision==0.20.1+cu124",
  "torchdiffeq==0.2.5",
  "transformers==4.53.3",
  "accelerate==0.30.1",
  "huggingface-hub==0.30.0",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "safetensors==0.5.3",
  "einops==0.8.1",
  "transforms3d==0.4.2",
  "PyYAML==6.0.2",
  "omegaconf==2.3.0",
  "click==8.1.3",
  "requests==2.32.4",
  "openai==1.78.1",
  "fbxsdkpy==2020.1.post2",
  "psutil==7.2.2",
]

[project.scripts]
hymotion = "hy_motion_cpu.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hy_motion_cpu"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
fbxsdkpy = { index = "inria-fbx" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "inria-fbx"
url = "https://gitlab.inria.fr/api/v4/projects/18692/packages/pypi/simple"
explicit = true
